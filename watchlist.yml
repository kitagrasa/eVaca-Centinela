# ---------------------------------------------------------------------------
# Ajustes técnicos del monitor. NO hace falta que toques esto.
#
# ¿A quién se sigue? A un fichero watchlist.md, una persona por línea... pero
# NO al de este repositorio (aquí no hay ninguna lista): al del REPOSITORIO DE
# ESTADO (privado), que el workflow clona en .state-repo. Aquí no se pone ningún
# nombre, porque este repositorio puede ser público.
# ---------------------------------------------------------------------------

# Lista de usuarios heredada del formato antiguo. Deja esto vacío: la lista
# buena está en el watchlist.md del repositorio de estado.
users: []

# Cómo de prudente eres con la API pública de eVaca.
http:
  delay_seconds: 0.35     # pausa entre peticiones (con jitter aleatorio)
  timeout_seconds: 30
  max_retries: 3

alerts:
  notify_on_baseline: true     # mensaje de bienvenida la 1ª vez que ve a un usuario
  notify_on_error: true        # avisa si eVaca bloquea o falla
  error_cooldown_minutes: 180  # ...como máximo una vez cada 3 horas

# ---------------------------------------------------------------------------
# Series para Portfolio Performance (subcomando `series`).
#
# Usan la MISMA lista de personas que el monitor: el watchlist.md del
# repositorio de estado. Aquí solo van los ajustes de la pasada: la pausa, los
# umbrales de aviso/calibración y los días de lectura de la rentabilidad.
# ---------------------------------------------------------------------------
series:
  pause_seconds: 3.0     # espera entre peticiones reales (de una en una)
  alert_pp: 0.2          # desviación (pp) que dispara el aviso por Telegram
  cap_pp: 0.5            # desviación (pp) para considerar el chart poco fiable
  stats_days: [5, 12]    # día 5 (un reintento el 6) y día 12; cada lectura revisa 3 meses atrás
  chart_window: lastTwoYears  # ventana del chart diario

# ---------------------------------------------------------------------------
# Horario en el que el monitor puede actuar (en hora de Madrid).
#
# El cron de GitHub va en UTC y no entiende de cambios de hora, así que el
# workflow dispara en un rango amplio y es aquí donde se recorta a la hora
# exacta de Madrid. Ajusta esta franja y ya está; no hay que tocar el .yml
# del workflow.
#
#   days: 1 = lunes ... 7 = domingo
# ---------------------------------------------------------------------------
schedule:
  enabled: true
  timezone: Europe/Madrid
  start: "08:30"
  end: "23:00"
  days: [1, 2, 3, 4, 5]        # lunes a viernes
